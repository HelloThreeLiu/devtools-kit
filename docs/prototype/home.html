<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-zcode-design>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevTools Kit · 主界面</title>
<link rel="stylesheet" href="assets/proto.css">
<script src="assets/proto.js"></script>
</head>
<body>
<div class="app">

  <main class="home">
    <h1 class="sr-only">DevTools Kit 开发工具箱</h1>

    <!-- 分类标签 + 外观菜单 -->
    <div class="tabs" id="tabs">
      <div class="grow" role="tablist" aria-label="工具分类" id="tablist"></div>
      <div class="menu-anchor">
        <button type="button" class="icon-btn" id="themeBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="themeMenu" aria-label="外观" title="外观：跟随系统 / 亮色 / 暗色" data-theme-icon>
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-monitor"></use></svg>
        </button>
        <div class="menu" id="themeMenu" role="menu" aria-label="外观" hidden>
          <button type="button" role="menuitemradio" data-theme-option="auto" aria-checked="false">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-monitor"></use></svg><span>跟随系统</span>
            <svg class="icon icon--sm" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg>
          </button>
          <button type="button" role="menuitemradio" data-theme-option="light" aria-checked="false">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-sun"></use></svg><span>亮色</span>
            <svg class="icon icon--sm" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg>
          </button>
          <button type="button" role="menuitemradio" data-theme-option="dark" aria-checked="false">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-moon"></use></svg><span>暗色</span>
            <svg class="icon icon--sm" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- 分区列表：由脚本按注册表渲染 -->
    <div class="home-body" id="homeBody" role="tabpanel" tabindex="0" aria-labelledby="tab-all"></div>

    <footer class="statusbar">
      <span class="hint">
        <kbd class="kbd"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-arrow-up"></use></svg></kbd>
        <kbd class="kbd"><svg class="icon icon--xs" aria-hidden="true" focusable="false"><use href="#i-arrow-down"></use></svg></kbd>
        选择
      </span>
      <span class="hint"><kbd class="kbd">Enter</kbd> 打开</span>
      <span class="grow"></span>
      <span class="detail" id="detail"></span>
    </footer>
  </main>

</div>

<script>
(function () {
  'use strict'
  const proto = window.proto
  const { esc, icon, TOOLS, CATEGORIES, toolById, getFavorites, getRecent } = proto

  const tabsEl = document.getElementById('tabs')
  const tablistEl = document.getElementById('tablist')
  const bodyEl = document.getElementById('homeBody')
  const detailEl = document.getElementById('detail')
  const themeBtn = document.getElementById('themeBtn')
  const themeMenu = document.getElementById('themeMenu')
  const menuAnchor = tabsEl.querySelector('.menu-anchor')

  const DEFAULT_DETAIL = icon('shield') + '<span>全部计算在本机完成，不上传任何数据</span>'
  const SUGGEST = ['时间戳', 'json', 'base64', '颜色']

  let cat = 'all'
  let query = (new URLSearchParams(location.search).get('q') || '').trim()
  let focusIndex = -1 // 重新渲染前，「全部工具」里获得焦点的行

  const inCat = (t) => cat === 'all' || t.cat === cat
  const countOf = (c) => TOOLS.filter((t) => c === 'all' || t.cat === c).length

  // 工具名 + 指令 + 关键词 + 说明的模糊匹配，多个词以空格分隔时须全部命中
  const words = () => query.toLowerCase().split(/\s+/).filter(Boolean)
  const matches = (t) => {
    const w = words()
    if (!w.length) return true
    const hay = (t.name + ' ' + t.cmds.join(' ') + ' ' + t.kw + ' ' + t.desc).toLowerCase()
    return w.every((x) => hay.includes(x))
  }

  /* ---------- 模板 ---------- */

  // 行容器 <li> 内：已出原型的工具是链接，其余是按钮（点击提示「尚未出原型」）；
  // 收藏开关是主控件的同级元素，避免交互控件互相嵌套
  function toolRow(t, extra, tail) {
    const inner = icon(t.icon) + `<span class="name">${esc(t.name)}</span>` + (extra || '')
    const main = t.page
      ? `<a class="row-main" href="${t.page}.html" data-nav="${t.page}" data-id="${t.id}">${inner}</a>`
      : `<button type="button" class="row-main" data-todo="${t.id}" data-id="${t.id}">${inner}</button>`
    return `<li class="row">${main}${tail || ''}</li>`
  }

  const section = (id, title, inner) =>
    `<section class="section${id === 'all' ? ' section--all' : ''}" aria-labelledby="h-${id}">` +
    `<h2 id="h-${id}">${title}</h2><div class="section-body">${inner}</div></section>`

  function emptyHTML() {
    const where = cat === 'all' ? '' : `「${esc(CATEGORIES.find((c) => c.id === cat).name)}」分类下`
    const tries = SUGGEST.filter((s) => {
      const keep = query
      query = s
      const hit = TOOLS.some((t) => inCat(t) && matches(t))
      query = keep
      return hit
    })
    return '<div class="empty">' +
      `<h3>${where}没有找到与「${esc(query)}」匹配的工具</h3>` +
      '<p>按工具名称、直达指令和关键词匹配，例如 timestamp、md5、驼峰。</p>' +
      '<div class="actions">' +
      '<button type="button" class="btn" data-query="">清除搜索</button>' +
      (tries.length ? '<span class="label">试试</span>' + tries.map((s) => `<button type="button" class="example" data-query="${esc(s)}">${esc(s)}</button>`).join('') : '') +
      '</div></div>'
  }

  /* ---------- 渲染 ---------- */

  const catRows = () => Array.from(bodyEl.querySelectorAll('.tools .row-main'))

  function render() {
    const active = document.activeElement
    const keep = {
      fav: active && active.dataset ? active.dataset.fav : null,
      row: active && active.closest && active.closest('.tools .row-main') ? Math.max(focusIndex, 0) : null,
    }

    const favs = getFavorites().map((id) => toolById.get(id)).filter((t) => t && inCat(t) && matches(t))
    const recent = getRecent().filter((r) => { const t = toolById.get(r.id); return t && inCat(t) && matches(t) })
    const all = TOOLS.filter((t) => inCat(t) && matches(t))

    if (!all.length) {
      bodyEl.innerHTML = emptyHTML()
      proto.syncFavButtons()
      setDetail(null)
      return
    }

    let html = ''
    // 我的收藏：置顶分组，按收藏时间倒序（PRD 4.7.2）
    if (favs.length) html += section('fav', '我的收藏', `<div class="quick">${favs.map((t) => toolRow(t)).join('')}</div>`)
    // 最近使用：按最后使用时间倒序，最多 10 个（PRD 4.7.1）
    if (recent.length) html += section('recent', '最近使用',
      `<div class="quick">${recent.map((r) => toolRow(toolById.get(r.id), `<span class="meta">${proto.relTime(r.ts)}</span>`)).join('')}</div>`)
    html += section('all', '全部工具',
      `<ul class="tools" aria-label="全部工具">${all.map((t) => toolRow(t, t.p === 'P1' ? '<span class="tag">P1</span>' : '', proto.favButton(t))).join('')}</ul>`)

    bodyEl.innerHTML = html
    proto.syncFavButtons()

    // 焦点落回等价元素：收藏开关 / 同序号的工具行
    if (keep.fav) {
      const star = bodyEl.querySelector(`.tools [data-fav="${keep.fav}"]`)
      if (star) { star.focus(); return }
    }
    if (keep.row != null) {
      const rows = catRows()
      if (rows.length) rows[Math.min(keep.row, rows.length - 1)].focus()
    }
  }

  function renderTabs() {
    tablistEl.innerHTML = CATEGORIES.map((c) =>
      `<button type="button" class="tab" role="tab" id="tab-${c.id}" data-cat="${c.id}" aria-selected="${c.id === cat}" aria-controls="homeBody">` +
      `${esc(c.name)}<span class="n">${countOf(c.id)}</span></button>`).join('')
    bodyEl.setAttribute('aria-labelledby', 'tab-' + cat)
  }

  function selectCat(id) {
    cat = id
    tablistEl.querySelectorAll('[role="tab"]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.cat === id)))
    bodyEl.setAttribute('aria-labelledby', 'tab-' + id)
    render()
  }

  function setQuery(text) {
    query = (text || '').trim()
    proto.toHost({ type: 'proto:set-input', text: query }) // 同步宿主输入框
    render()
  }

  /* ---------- 状态栏详情：说明当前指向的工具 ---------- */

  function setDetail(t) {
    if (!t) { detailEl.innerHTML = DEFAULT_DETAIL; return }
    detailEl.innerHTML = `<span>${esc(t.desc)}</span><code>${esc(t.kw.replace(/ /g, ' · '))}</code>`
  }

  const focusedTool = () => {
    const main = document.activeElement && document.activeElement.closest ? document.activeElement.closest('.row-main') : null
    return main ? toolById.get(main.dataset.id) : null
  }

  bodyEl.addEventListener('focusin', (e) => {
    const main = e.target.closest('.row-main')
    if (main) setDetail(toolById.get(main.dataset.id))
  })
  bodyEl.addEventListener('focusout', () => setTimeout(() => { if (!bodyEl.contains(document.activeElement)) setDetail(null) }, 0))
  bodyEl.addEventListener('mouseover', (e) => {
    const main = e.target.closest('.row-main')
    if (main) setDetail(toolById.get(main.dataset.id))
  })
  bodyEl.addEventListener('mouseleave', () => setDetail(focusedTool()))

  /* ---------- 列表交互 ---------- */

  bodyEl.addEventListener('focusin', (e) => {
    const main = e.target.closest('.tools .row-main')
    if (main) focusIndex = catRows().indexOf(main)
  })

  bodyEl.addEventListener('click', (e) => {
    const q = e.target.closest('[data-query]')
    if (q) { setQuery(q.dataset.query); return }
    const todo = e.target.closest('[data-todo]')
    if (todo) window.protoToast(`「${toolById.get(todo.dataset.todo).name}」尚未出原型`)
  })

  // 两列网格：← → 移动一格，↑ ↓ 移动一行；首行再往上则把焦点交还主输入框
  bodyEl.addEventListener('keydown', (e) => {
    const main = e.target.closest('.tools .row-main')
    if (!main || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return
    const rows = catRows()
    const i = rows.indexOf(main)
    let j = i
    if (e.key === 'ArrowRight') j = i + 1
    else if (e.key === 'ArrowLeft') j = i - 1
    else if (e.key === 'ArrowDown') j = i + 2
    else if (e.key === 'ArrowUp') j = i - 2
    else if (e.key === 'Home') j = 0
    else if (e.key === 'End') j = rows.length - 1
    else return
    e.preventDefault()
    if (j < 0) proto.toHost({ type: 'proto:focus-input' }) // 对应 utools.subInputFocus()
    else rows[Math.min(j, rows.length - 1)].focus()
  })

  /* ---------- 分类标签 ---------- */

  tabsEl.addEventListener('click', (e) => {
    const tab = e.target.closest('[role="tab"]')
    if (tab) selectCat(tab.dataset.cat)
  })

  tabsEl.addEventListener('keydown', (e) => {
    const tab = e.target.closest('[role="tab"]')
    if (!tab || e.altKey || e.ctrlKey || e.metaKey) return
    const idx = CATEGORIES.findIndex((c) => c.id === tab.dataset.cat)
    let j = idx
    if (e.key === 'ArrowRight') j = (idx + 1) % CATEGORIES.length
    else if (e.key === 'ArrowLeft') j = (idx - 1 + CATEGORIES.length) % CATEGORIES.length
    else if (e.key === 'Home') j = 0
    else if (e.key === 'End') j = CATEGORIES.length - 1
    else return
    e.preventDefault()
    selectCat(CATEGORIES[j].id)
    tablistEl.querySelector(`[data-cat="${CATEGORIES[j].id}"]`).focus()
  })

  // 标签上按 ↓ 直接进入列表
  tablistEl.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowDown' || e.altKey || e.ctrlKey || e.metaKey) return
    e.preventDefault()
    const first = catRows()[0]
    if (first) first.focus()
  })

  /* ---------- 外观菜单：跟随系统 / 亮色 / 暗色（PRD 4.7.3）---------- */

  function setMenu(open) {
    themeMenu.hidden = !open
    themeBtn.setAttribute('aria-expanded', String(open))
    if (open) {
      const current = themeMenu.querySelector('[aria-checked="true"]') || themeMenu.querySelector('button')
      current.focus()
    }
  }

  themeBtn.addEventListener('click', () => setMenu(themeMenu.hidden))

  document.addEventListener('click', (e) => {
    if (!themeMenu.hidden && !e.target.closest('.menu-anchor')) setMenu(false)
  })

  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-theme-option]') && themeMenu.contains(e.target)) {
      setMenu(false)
      themeBtn.focus()
    }
  })

  menuAnchor.addEventListener('focusout', () => setTimeout(() => {
    if (!menuAnchor.contains(document.activeElement)) setMenu(false)
  }, 0))

  /* ---------- 宿主联动：模拟 setSubInput(onChange) 过滤与回车直达 ---------- */

  document.addEventListener('proto:host', (e) => {
    const d = e.detail
    if (d.type === 'proto:filter') { query = (d.text || '').trim(); render() }
    else if (d.type === 'proto:focus-list') { const first = catRows()[0]; if (first) first.focus() }
    else if (d.type === 'proto:enter') { const first = catRows()[0]; if (first) first.click() }
  })

  document.addEventListener('proto:fav', render)
  document.addEventListener('proto:ready', () => { renderTabs(); render(); setDetail(null) })
})()
</script>
</body>
</html>
