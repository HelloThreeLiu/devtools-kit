name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新提交取消仍在跑的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 插件目标平台：Windows / macOS / Linux（跟随 uTools Runtime 支持范围）
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm 的已知问题：单平台增量安装会把其它平台 optional 依赖的子树从
        # lockfile 中裁剪掉，导致其它平台 npm ci 报 out-of-sync。
        # fallback 到 npm install 自动补齐，保证三平台均可安装。
        run: npm ci || npm install --no-fund --no-audit

      - name: Validate plugin.json
        run: node scripts/validate-plugin.mjs

      - name: Static audits (imports / payload hooks / css classes / match regex)
        run: npm run audit

      - name: Build (vite)
        run: npm run build

      - name: Verify dist plugin structure
        run: node scripts/check-dist.mjs

      - name: Unit tests
        run: npm test

      - name: Upload dist artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
